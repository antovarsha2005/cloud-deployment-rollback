steps:
  - name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:stable'
    entrypoint: 'bash'
    args:
      - '-c'
     - |
        set -e
        apt-get update
        apt-get install -y curl
        chmod +x deploy-with-rollback.sh
        ./deploy-with-rollback.sh
options:
  logging: CLOUD_LOGGING_ONLY
